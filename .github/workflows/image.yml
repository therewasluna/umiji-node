# Builds the node image for amd64 and arm64 and pushes it to ghcr.io/therewasluna/umiji-node,
# the image the panel's node installer pulls. ghcr only: the bake file's Docker Hub name isn't used.
name: Node image

on:
    push:
        branches: [main, 'ci/**']
        tags: ['v*']
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: node-image-${{ github.ref }}
    cancel-in-progress: true

jobs:
    image:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-qemu-action@v3
            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/therewasluna/umiji-node
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=ref,event=branch
                      type=ref,event=tag
                      type=sha

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
